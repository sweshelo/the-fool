pre-commit:
  jobs:
    - name: lint
      run: bunx oxlint --no-error-on-unmatched-pattern {staged_files}
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'

    - name: ban as
      run: bunx eslint

    - name: format
      run: bunx oxfmt {staged_files}
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'

    - name: stage
      run: git add {staged_files}

    - name: type check
      run: bunx tsc
